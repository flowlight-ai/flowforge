# FlowLight CI/CD Pipeline (Gitee Go) — flowforge 真实门禁
# 含: 代码检查 + 文档检查 + 品牌净化 + 类型检查 + 单元测试
name: flowforge-ci
displayName: FlowForge CI Pipeline

triggers:
  push:
    branches:
      precise:
        - master
        - dev
  pr:
    branches:
      precise:
        - master
        - dev

stages:
  - stage: lint
    displayName: 代码检查 (Ruff)
    steps:
      - step: script@python
        name: ruff-lint
        displayName: Ruff 自动修复 + 真实错误拦截
        image: python:3.12
        script: |
          pip install ruff -q
          ruff check . --fix --select F401,F811,F841 || true
          ruff check . --select F821,F822,F811,E9

  - stage: docs
    displayName: 文档检查 + 品牌净化
    steps:
      - step: script@python
        name: doc-check
        displayName: 文档链接与品牌词检查
        image: python:3.12
        script: |
          pip install ruff -q
          echo "=== 品牌净化：禁止遗留 openclaw_ai / cat-cafe / Clowder AI 等旧标识 ==="
          if grep -rniE "openclaw_ai|cat-cafe|Clowder AI|openclaw_pkg" --include="*.md" --include="*.py" --include="*.yml" --include="*.yaml" --include="*.json" . | grep -v ".gitee-ci.yml"; then
            echo "✗ 发现旧品牌/组织标识残留，请清理后再提交"
            exit 1
          fi
          echo "✓ 品牌净化通过"
          echo "=== 文档检查：README 存在性 ==="
          test -f README.md && echo "✓ README.md 存在" || { echo "✗ 缺少 README.md"; exit 1; }

  - stage: type-check
    displayName: 类型检查 (Mypy, 报告模式)
    steps:
      - step: script@python
        name: mypy-check
        displayName: Mypy 类型检查
        image: python:3.12
        script: |
          pip install mypy -q
          mypy . --ignore-missing-imports --no-error-summary || true
          echo "(mypy 为报告模式，不阻断合并)"

  - stage: test
    displayName: 单元测试 (Pytest)
    steps:
      - step: script@python
        name: pytest-run
        displayName: Pytest + Coverage
        image: python:3.12
        script: |
          pip install -r requirements.txt -q 2>/dev/null || echo "无 requirements 或安装警告"
          pip install pytest pytest-cov -q
          pytest tests/ --ignore=tests/e2e --cov=. --cov-report=term-missing -q --tb=short
