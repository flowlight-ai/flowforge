packages:
  - vendor/*
  - packages/*/*
  - apps/*
  # T8.1：顶层 Next.js 前端原地并入 workspace（web/ 目录不动，CI 分层见 .github/workflows/web-ci.yml）。
  - web
  # The Landlock launcher keeps its native build and publication scripts
  # under native/landlock-run; entry + per-platform prebuilt packages live there.
  - native/landlock-run
  - native/landlock-run/packages/*
allowBuilds:
  esbuild: true
  # Cross-platform boundary for the persistent PTY backend, including ConPTY on Windows.
  node-pty: true
  # JSONL durability calls MoveFileExW with write-through publication on Windows.
  koffi: true
  # Reviewed workspace postinstall restores node-pty's spawn helper exec bit.
  '@flowforge/subprocess-local': true
  # Pulled in by @earendil-works/pi-ai (optional LLM API backend). Their
  # lifecycle scripts are no-ops we don't need, so deny them -- install still
  # succeeds.
  '@google/genai': false
  protobufjs: false
  # Grammar packages for @flowforge/plugin-codebase (web-tree-sitter WASM
  # pipeline): only the prebuilt .wasm grammars and query JSON are consumed;
  # the native node-gyp bindings are never loaded, so deny their builds.
  tree-sitter-javascript: false
  tree-sitter-typescript: false
