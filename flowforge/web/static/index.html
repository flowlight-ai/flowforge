<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlowForge Forgekin Council Chat</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>
      FlowForge Forgekin Council
      <span class="subtitle">5 灵智体协作议事通道 · web group channel</span>
    </h1>
    <div class="header-actions">
      <span class="status-badge">● online · council quorum 2/5</span>
    </div>
  </header>

  <div class="app-body">
    <aside class="council-sidebar">
      <!-- Populated by app.js renderSidebar() -->
    </aside>

    <main class="chat-area">
      <div class="chat-messages">
        <!-- Messages populated by app.js -->
      </div>

      <div class="chat-input-area" style="position:relative">
        <textarea id="message-input" placeholder="输入消息，@提及灵智体，Enter 发送..." rows="1"></textarea>
        <button id="send-button">发送</button>
      </div>

      <div class="verify-bar">
        <button onclick="runT7Verify()">T7 LLM 审核</button>
        <span id="t7-result" class="verify-result">未运行</span>
        <button onclick="runT8Verify()">T8 DOM 验证</button>
        <span id="t8-result" class="verify-result">未运行</span>
      </div>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
