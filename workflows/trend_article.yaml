name: "trend_article"
version: "1.0"
steps:
  - name: "trend_analysis"
    agent: "trend_analysis"
    mode: "react"
    output: "trends"
  - name: "topic_research"
    agent: "topic_research"
    mode: "rewoo"
    output: "topics"
  - name: "writing"
    agent: "article_writing"
    mode: "reflexion"
    output: "draft"
  - name: "publish"
    agent: "publishing"
    mode: "plan_execute"
    output: "published_urls"
