name: "multi_platform"
version: "1.0"
steps:
  - name: "topic_research"
    agent: "topic_research"
    mode: "rewoo"
    output: "topics"
  - name: "writing"
    agent: "article_writing"
    mode: "reflexion"
    output: "draft"
  - name: "repurpose"
    agent: "content_repurposer"
    mode: "plan_execute"
    output: "variants"
  - name: "publish"
    agent: "publishing"
    mode: "rewoo"
    output: "published_urls"
