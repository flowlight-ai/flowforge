name: "seo_content"
version: "1.0"
steps:
  - name: "topic_research"
    agent: "topic_research"
    mode: "rewoo"
    output: "topics"
  - name: "seo_optimization"
    agent: "seo_optimization"
    mode: "plan_execute"
    output: "seo_keywords"
  - name: "material_collection"
    agent: "material_collection"
    mode: "rewoo"
    output: "materials"
  - name: "writing"
    agent: "article_writing"
    mode: "reflexion"
    output: "draft"
  - name: "fact_check"
    agent: "fact_check"
    mode: "react"
    output: "fact_check_result"
  - name: "publish"
    agent: "publishing"
    mode: "plan_execute"
    output: "published_urls"
