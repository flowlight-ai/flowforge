name: "seo_content"
version: "1.0"
display_name: "SEO 内容"
description: "SEO 驱动的内容创作：选题→关键词优化→素材→写作→核查→发布"
icon: "🔍"
category: "content"

steps:
  - name: "topic_research"
    agent: "topic_research"
    mode: "rewoo"
    output: "topics"
  - name: "seo_optimization"
    agent: "seo_optimization"
    mode: "plan_execute"
    output: "seo_keywords"
  - name: "material_collection"
    agent: "material_collection"
    mode: "rewoo"
    output: "materials"
  - name: "writing"
    agent: "article_writing"
    mode: "reflexion"
    output: "draft"
  - name: "fact_check"
    agent: "fact_check"
    mode: "react"
    output: "fact_check_result"
  - name: "publish"
    agent: "publishing"
    mode: "plan_execute"
    output: "published_urls"
