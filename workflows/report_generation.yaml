name: "report_generation"
version: "1.0"
steps:
  - name: "topic_research"
    agent: "topic_research"
    mode: "rewoo"
    output: "topics"
  - parallel_group:
      - name: "research_1"
        agent: "material_collection"
        mode: "rewoo"
        output: "materials_1"
      - name: "research_2"
        agent: "material_collection"
        mode: "rewoo"
        output: "materials_2"
  - name: "writing"
    agent: "article_writing"
    mode: "reflexion"
    output: "draft"
  - name: "seo_optimization"
    agent: "seo_optimization"
    mode: "plan_execute"
    output: "seo_title"
  - name: "fact_check"
    agent: "fact_check"
    mode: "react"
    output: "fact_check_result"
  - name: "content_audit"
    agent: "content_audit"
    mode: "agent_judge"
    output: "audit_result"
  - name: "review"
    human: true
  - name: "publish"
    agent: "publishing"
    mode: "plan_execute"
    output: "published_urls"
