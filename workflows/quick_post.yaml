name: "quick_post"
version: "1.0"
display_name: "快速发文"
description: "轻量级发文流程：选题→写作→发布，适合时效性内容"
icon: "⚡"
category: "content"

steps:
  - name: "topic_research"
    agent: "topic_research"
    mode: "rewoo"
    output: "topics"
  - name: "writing"
    agent: "article_writing"
    mode: "reflexion"
    output: "draft"
  - name: "publish"
    agent: "publishing"
    mode: "plan_execute"
    output: "published_urls"
