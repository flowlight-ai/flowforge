name: "image_article"
version: "1.0"
steps:
  - name: "topic_research"
    agent: "topic_research"
    mode: "rewoo"
    output: "topics"
  - name: "material_collection"
    agent: "material_collection"
    mode: "rewoo"
    output: "materials"
  - name: "writing"
    agent: "article_writing"
    mode: "reflexion"
    output: "draft"
  - name: "image_research"
    agent: "image_research"
    mode: "rewoo"
    output: "images"
  - name: "publish"
    agent: "publishing"
    mode: "plan_execute"
    output: "published_urls"
