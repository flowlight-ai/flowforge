[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowforge"
version = "0.1.0"
description = "FlowForge — self-evolving agent harness with a Forgekin application layer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "flowlight-ai", email = "dev@flowlight-ai.dev" }
]
keywords = ["agent", "self-evolution", "multi-agent", "llm", "agi", "forgekin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.5,<3.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "anyio>=4.0",
    # Web app (Forgekin Council Chat) — needed for flowforge.web.app
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",  # [standard] includes websockets + httptools
    "websockets>=12.0",          # imported directly by tests/test_websocket_load.py
    # API / runtime extras (imported by app/core/scheduler/loop modules)
    "pydantic-settings>=2.0",    # flowforge.core.config (BaseSettings)
    "apscheduler>=3.10",         # flowforge.scheduler.scheduler
    "python-multipart>=0.0.9",   # FastAPI Form/File route analysis
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "playwright>=1.40",
]
cli = [
    "click>=8.1",
]

[project.urls]
Homepage = "https://github.com/flowlight-ai/flowforge"
Documentation = "https://github.com/flowlight-ai/flowforge/tree/main/docs"
Repository = "https://github.com/flowlight-ai/flowforge"
Issues = "https://github.com/flowlight-ai/flowforge/issues"
Changelog = "https://github.com/flowlight-ai/flowforge/blob/main/CHANGELOG.md"

[project.scripts]
flowforge = "flowforge.cli.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["flowforge*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
flowforge = ["py.typed", "config/*.yaml"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["docs", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "C4"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--color=yes",
]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: integration tests that call real external APIs",
    "e2e: end-to-end tests",
    "timeout: per-test timeout (requires pytest-timeout)",
]

[tool.coverage.run]
source = ["flowforge"]
omit = ["tests/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
