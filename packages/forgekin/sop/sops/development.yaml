id: development
domain: engineering
label: Development SOP
description: FlowForge/DevForge coding feature lifecycle
stages:
  - id: kickoff
    label: 立项
    suggested_skill: feat-lifecycle
    hard_rules:
      - id: kickoff-ac-checklist
        text: Feature spec 必须有验收条件(AC) + 需求点 checklist
        severity: blocker
        predicate:
          type: manual_only
          reason: Feature spec completeness is reviewed from docs and context
    pitfalls:
      - id: kickoff-no-unconfirmed-implementation
        text: 没有用户确认就直接开始实现
        severity: warn
        predicate:
          type: manual_only
          reason: user confirmation is conversational intent

  - id: impl
    label: 实现
    suggested_skill: writing-plans
    hard_rules:
      - id: impl-main-sync-before-worktree
        text: worktree 开之前必须 main 双向同步 (ahead=0 behind=0)
        severity: blocker
        predicate:
          type: git_state_predicate
          repository: current
          branch: main
          checks: [ahead_zero, behind_zero]
          before_command: git worktree add
      - id: impl-design-gate-before-code
        text: 跳过 Design Gate 直接写代码
        severity: blocker
        predicate:
          type: manual_only
          reason: Design Gate evidence is feature-doc field
      - id: impl-no-hardcode-prompts
        text: 禁止在 .py 文件中硬编码提示词（铁律5+P16+P34）
        severity: blocker
        predicate:
          type: manual_only
          reason: prompts must be externalized to YAML config
    pitfalls:
      - id: impl-post-compact-recall-loss
        text: 压缩后忘了当前在做什么
        severity: warn
        predicate:
          type: manual_only

  - id: quality_gate
    label: 自检
    suggested_skill: quality-gate
    hard_rules:
      - id: quality-gate-vision-coverage
        text: 自检报告必须包含愿景覆盖度
        severity: blocker
        predicate:
          type: manual_only
      - id: quality-gate-no-mock-llm
        text: 禁止使用 Mock LLM（铁律T1+红线3）
        severity: blocker
        predicate:
          type: manual_only
      - id: quality-gate-no-fake-data
        text: 禁止使用假数据（铁律T2+红线4）
        severity: blocker
        predicate:
          type: manual_only
    pitfalls:
      - id: quality-gate-full-test-evidence
        text: 声称完成但没跑全量测试
        severity: blocker
        predicate:
          type: command_pattern
          must_match: pytest|python -m pytest|python -m unittest

  - id: fresh_context
    label: Fresh-Context Pre-Review
    suggested_skill: fresh-context-review
    optional: true
    hard_rules: []
    pitfalls:
      - id: fresh-context-not-approval
        text: Fresh-context 是 finding generator，不是 approval authority
        severity: warn
        predicate:
          type: manual_only

  - id: review
    label: Review
    suggested_skill: request-review
    hard_rules:
      - id: review-no-self-review
        text: 同一个体不能 review 自己的代码
        severity: blocker
        predicate:
          type: handle_check
          constraint: reviewer_not_author
      - id: review-original-requirements
        text: Review 请求必须附原始需求摘录
        severity: blocker
        predicate:
          type: manual_only
    pitfalls:
      - id: review-retrigger-after-p1
        text: 收到 P1 修完后没 re-trigger review
        severity: blocker
        predicate:
          type: command_sequence
          must_include:
            - git push
            - gh pr comment

  - id: merge
    label: 合入
    suggested_skill: merge-gate
    hard_rules:
      - id: merge-github-squash-only
        text: 必须用 gh pr merge --squash（禁止本地 squash）
        severity: blocker
        predicate:
          type: command_pattern
          must_match: gh pr merge .*--squash
          must_not_match: git merge --squash|git reset --soft
      - id: merge-feature-doc-truth
        text: merge 前核对 feature doc 是否说真话
        severity: blocker
        predicate:
          type: manual_only
    pitfalls:
      - id: merge-runtime-update-after-merge
        text: 合入后擅自更新 runtime
        severity: blocker
        predicate:
          type: command_sequence
          cwd_contains: flowforge
          anti_pattern:
            - pnpm start
            - python -m flowforge

  - id: completion
    label: 完成
    suggested_skill: feat-lifecycle
    hard_rules:
      - id: completion-vision-guardian
        text: feat close 前必须跨猫愿景守护（非作者非reviewer的agent做愿景三问）
        severity: blocker
        predicate:
          type: handle_check
          constraint: guardian_handoff_present
      - id: completion-pr-merged-feature-check
        text: PR merged + 测试通过
        severity: blocker
        predicate:
          type: command_sequence
          must_include:
            - gh pr view
            - pytest
