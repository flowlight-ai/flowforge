# governance/skills manifest.yaml — B19 wave 1 技能路由元数据
# source-of-truth: ./clowder-ai/cat-cafe-skills/manifest.yaml（仅抽取 4 核心包，结构对齐 parseManifestSkillMeta）
skills:
  deep-research:
    category: "调研与知识"
    description: >
      多源深度调研管道（Web Deep Research + Coder 合成 + 云端模型咨询）。
      Use when: 技术问题需要多源调查、设计决策需要证据、operator说"调研"/"research"、需要咨询云端模型。
      Not for: 简单搜索（直接用 WebSearch）、已有结论的确认。
      Output: 调研报告 + 证据合成 或 咨询文档（含回填区）。
    triggers:
      - "调研"
      - "research"
      - "深度研究"
      - "问一下 GPT Pro"
      - "咨询云端"
  expert-panel:
    category: "引导与协作"
    description: >
      多猫专家辩论团：独立分析→挑战→收敛→风险预演→语音汇报→文档交付。
      Use when: 用户明确要求 expert panel、专家辩论、多猫分析或三猫讨论。
      Not for: 普通"帮我分析一下"、单猫能搞定的问题、代码实现、bug fix、日常聊天。
      Output: 洞察卡片(rich block) + 语音总结 + 会议纪要 + 正式报告(DOCX/PDF)。
    triggers:
      - "专家辩论"
      - "expert panel"
      - "技术参谋"
      - "竞品分析"
      - "行业分析"
      - "趋势判断"
      - "多猫分析"
  cross-cat-handoff:
    category: "引导与协作"
    description: >
      跨猫传话/交接的五件套结构 + review entry/completion 双路由 + action successor 单飞身份。
      Use when: 交接工作给其他猫、传话、写 review 信、选择 fallback/下一棒，
      或创建 exact-HEAD external PR review task / PR tracking instructions。
      Not for: 自己的任务、不涉及其他猫的工作、纯并行思辨。
      Output: 结构化交接信；review 入口先分 formal/advisory，再按 author/custody/handoff
      source 选择 external GitHub artifact 或 local author route。
      GOTCHA: formal external review 与 no-comment 指令互斥；fallback 是有证据的 replace。
    triggers:
      - "交接"
      - "传话"
      - "handoff"
      - "fallback"
      - "下一棒"
      - "exact-HEAD review"
      - "PR tracking"
      - "advisory_read_only"
  debugging:
    category: "开发流程"
    description: >
      系统化 bug 定位：根因调查 → 模式分析 → 假设验证 → 修复。
      Use when: 遇到 bug、测试失败、unexpected behavior。
      Not for: 新功能开发、重构、已知原因的简单修复。
      Output: Bug report（5件套）+ 根因 + 修复（含回归测试）。
    triggers:
      - "bug"
      - "报错"
      - "test failure"
      - "unexpected behavior"
  tdd:
    category: "开发流程"
    description: >
      Red-Green-Refactor for changes with behavior or regression risk.
      Use when: adding observable behavior, fixing a bug, or changing logic not already covered by a precise executable check.
      Not for: pure docs/research, deterministic generated-artifact refreshes, or mechanical changes already covered by an existing checker.
      Output: observed RED (new test or existing failing check) → minimal GREEN → refactor under protection.
    triggers:
      - "写代码"
      - "test first"
      - "TDD"
      - "红绿重构"
  writing-plans:
    category: "开发流程"
    description: >
      将 spec/需求拆分为可执行的分步实施计划。
      Use when: 有 spec 或需求，准备动手前需要拆分步骤。
      Not for: trivial 改动（≤5 行）、已有详细计划。
      Output: 分步实施计划（含 TDD 步骤和检查点）。
    triggers:
      - "写计划"
      - "implementation plan"
      - "拆分步骤"
  quality-gate:
    category: "开发流程"
    description: >
      完成声明前的按需自检：愿景对照 + spec 合规 + 风险匹配验证。
      Use when: 准备对交付作完成声明、需要整理风险匹配的自证。
      Not for: 收到 review 反馈（用 receive-review）、merge（用 merge-gate）。
      Output: Spec 合规报告（含愿景覆盖度）。
    triggers:
      - "开发完了"
      - "准备 review"
      - "自检"
      - "声称完成"
  merge-gate:
    category: "开发流程"
    description: >
      合入 main：按行为 / 数据 / 安全 / 契约 / 不可逆风险选择 targeted 或 full gate，
      并消费有客观触发理由的独立 review source。
      Use when: 选中的 reviewer 放行后准备合入、开 PR 或准备 merge。
      Not for: 开发中、review 未通过、自检未完成。
      Output: PR merged + worktree cleaned。
    triggers:
      - "合入 main"
      - "merge"
      - "准备合入"
      - "开 PR"
      - "cloud review"
      - "gh pr create"
  thread-orchestration:
    category: "引导与协作"
    description: >
      大任务的主动拆解与多 thread 并行编排。
      Use when: 任务涉及 2+ 个独立可交付子任务，需要不同猫参与、不同 thread 并行推进。
      Not for: 单一任务（直接做）、已有 thread 之间的被动协调（用 cross-thread-sync）、
      单 session 内 subagent 并行（CLI 内置能力）。
      Output: 子 thread 创建 + 选猫 + 各 thread 交付 + 主 thread 汇聚报告。
      GOTCHA: projectPath 是子 thread 的工作区/真相源归属，不是外部目标仓。
    triggers:
      - "拆任务"
      - "分 thread"
      - "并行推进"
      - "开多个 thread"
      - "thread orchestration"
      - "任务分解"
  cross-thread-sync:
    category: "引导与协作"
    description: >
      跨 thread 协同：发现平行 session → 通知（3+2 件套）→ 争用协调 → 确认。
      Use when: 平行 session 之间需要协同、收到跨线程消息、通知改动影响、共享文件争用。
      Not for: 跨猫工作交接（用 cross-cat-handoff）。
      GOTCHA: 收到跨线程 ACTION 不等于接活；先做 thread/feat ownership gate，不属于当前 thread 就 cross-post 退回。
      Output: cross-post 通知 + 争用协调完成。
    triggers:
      - "跨线程"
      - "平行 session"
      - "cross thread"
      - "共享文件争用"
  collaborative-thinking:
    category: "引导与协作"
    description: >
      单人或多猫的创意探索、独立思考、讨论收敛。
      Use when: brainstorm、多猫独立思考、讨论结束需要收敛、方向性问题需要多视角。
      Not for: 已有明确 spec 直接写代码、单猫执行已定方案。
      Output: 收敛报告（共识/分歧/行动项）+ 三件套沉淀检查。
    triggers:
      - "brainstorm"
      - "讨论"
      - "多猫独立思考"
      - "收敛"
  custody-recognition:
    category: "开发流程"
    description: >
      识别他人是否委托工作（custody offer）：abstain / admit / offer / retry。
      Use when: 某个来源可能委托工作、期待接球、后续跟踪、别忘记做某事。
      Not for: 随口提及、终盘 offer、泛化计划、Schedule / Needs Me。
      Output: abstain / admit / offer / retry 决策。
    triggers:
      - "帮我接住"
      - "帮我跟踪"
      - "之后要做"
      - "别忘了"
      - "custody offer"
  fresh-context-review:
    category: "开发流程"
    description: >
      Author-triggered fresh-context scan of PR diff.
      Finding generator, NOT approval authority.
      Use when: quality-gate 通过且 PR 非 trivial，想降低正式 reviewer 认知负荷。
      Not for: 正式 review verdict、approval、merge decision。
      Output: Finding list（附在 review request 中）。
    triggers:
      - "fresh context"
      - "pre-review scan"
      - "找新眼看看"
  request-review:
    category: "开发流程"
    description: >
      Route a change to a non-author local peer when local review is the selected independent validation source.
      Use when: risk routing chooses a stateful local reviewer for implementation, governance, or semantic context.
      Not for: cloud as the selected source, vision-guardian acceptance, self-check, or review feedback handling.
      Output: risk-matched review packet + provenance-matched verdict route; mailbox archive only when the change needs the full packet.
    triggers:
      - "请 review"
      - "帮我看看"
      - "request review"
  receive-review:
    category: "开发流程"
    description: >
      处理 reviewer 反馈：Red→Green 修复 + 技术论证（禁止表演性同意）。
      Use when: 收到 review 结果、reviewer 提了 P1/P2、需要处理反馈。
      Not for: 发 review 请求（用 request-review）、自检（用 quality-gate）。
      Output: 逐项修复确认 + reviewer 放行。
    triggers:
      - "review 结果"
      - "review 意见"
      - "reviewer 说"
      - "fix these"
  receive-handoff-grounding:
    category: "协作 / 防御"
    description: >
      接球前真相核验三问：claim → resolver → verdict (sourceTier T0/T1/T2 + actionFamily)，
      防止把传球者当无审视真相源 (F167 Phase O 第一性原理)。
      Use when: 即将调 hold_ball / register_pr_tracking / register_issue_tracking /
      merge / takeover / 改 owner / 任何 irreversible action / 基于 "operator signoff" 或
      "你是 owner" 类 claim 行动之前。
      Not for: 纯阅读 cross_post (无 actionFamily 后续)、本 thread 日常 @mention 无副作用、
      implementation continuation (自检通过的下一步)。
      Output: Claim grounding verdict (verified/mismatch/insufficient) + 接球决策
      (proceed / block / push back to source thread)。
    triggers:
      - "hold_ball"
      - "register_pr_tracking"
      - "register_issue_tracking"
      - "merge approval"
      - "operator signoff"
      - "takeover"
      - "irreversible"
      - "owner reassignment"
      - "这是你的"
      - "应该是你接"
      - "operator 同意"
      - "等 X"
      - "PR 在"
  feat-lifecycle:
    category: "开发流程"
    description: >
      Feature 立项、讨论、完成的全生命周期管理。
      Use when: 开个新功能、new feature、F0xx、立项、feature 完成、验收通过、讨论新功能需求。
      Not for: 不涉及 Feature/Design Gate 真相更新的纯代码实现、review、merge（那些有专门的 skill）。
      Output: Feature 聚合文件 + BACKLOG 索引 + 真相源同步。
    triggers:
      - "开个新功能"
      - "new feature"
      - "建档"
      - "立项"
      - "F0xx"
  worktree:
    category: "开发流程"
    description: >
      创建 Git worktree 隔离开发环境，含 Redis 6398 安全配置。
      Use when: 开始任何代码修改、新功能开发、bug fix。
      Not for: classifier 放行的 co-creation docs direct-push lane、不涉及代码的讨论。
      Output: 隔离的 worktree + 正确的 Redis/环境配置。
    triggers:
      - "开始开发"
      - "新 worktree"
      - "隔离环境"
  co-creation-docs:
    category: "开发流程"
    description: >
      共创型文档交付 lane：先区分只审阅还是授权落盘，再用冲突、治理风险、可逆性决定 direct push / PR / cloud / full gate。
      Use when: 共创架构图、思想纲领、discussion、研究笔记或其他 docs-only 内容并准备落盘。
      Not for: 只读 review、任何代码/脚本/skill/SOP 执行面改动、用户数据或外部契约变更。
      Output: 风险匹配的文档校验 + 可选内容 review + commit/push 或 PR 证据。
      GOTCHA: 行数和 Markdown diff 不是升档条件；显然 light 可自判直推，进入重载体前或拿不准时才运行 classifier。
    triggers:
      - "共创文档"
      - "落盘文档"
      - "docs lane"
  owner-friendly-plugin-development:
    category: "开发流程"
    description: >
      把真实用户旅程转成可安装、可授权、状态诚实、可恢复的 Clowder AI 插件产品边界。
      Use when: 设计或开发需要 Settings 安装/授权、后台 runtime、事件或数据入站、Needs Me、Host 路由的插件。
      Not for: 只搭 Codex 插件目录、纯 skill/MCP、无宿主生命周期的一次性 API 脚本、只修插件内部实现 bug。
      Output: 用户旅程契约 + ownership/authority map + 生命周期/恢复/发布方案 + fresh-consumer 与真实 dogfood 证据。
    triggers:
      - "开发插件"
      - "设计插件"
      - "插件产品边界"
  rich-messaging:
    category: "引导与协作"
    description: >
      在当前 Chat 直接交付可看、可听或可操作产物（语音、图片、截图、HTML/demo、卡片、清单、diff、交互选择），无需用户说"富文本"。
      Use when: 用户要在当前 Chat 直接看到/听到/操作结果、定时任务唤醒后要发富媒体。
      Not for: 纯文字、讨论/修改 HTML 源码、复杂 localhost 应用（用 browser-preview）。
      Output: 产物进入 rich block（audio/card/checklist/diff/file/media_gallery/interactive/html_widget）或 Browser panel。
    triggers:
      - "发语音"
      - "说一句"
      - "用语音说"
      - "voice"
      - "audio"
      - "发图"
      - "发张图"
      - "截图给我看"
      - "screenshot"
      - "画个 HTML 展示"
      - "做个 demo 给我看"
      - "在 Chat 里展示"
      - "发个卡片"
      - "rich block"
      - "checklist"
      - "发个清单"
      - "长结构化汇报"
      - "结构化汇报"
      - "展示一下"
      - "给我听听"
      - "给我看看"
      - "show me"
      - "interactive"
  convention-graph-discovery:
    category: "调研与知识"
    description: >
      约定图发现方法论：进一个 repo 先识别 repo-specific conventions，再定义 domain/extractor 接 Convention Graph 引擎。
      Use when: 进入陌生 repo、要画约定图、要找"改 X 影响谁"的约定层关联、F242/Convention Graph Layer 工作。
      Not for: 普通符号跳转/LSP（用 codegraph）、文档索引检索、记忆图谱、直接使用 codegraph/GitNexus。
      Output: domain 定义 + extractor 计划 + gap/freshness/provenance 报告。
      GOTCHA: 沉淀的是"怎么画图"的方法，不是把 cat-cafe 的 extractor 硬搬到所有 repo。
    triggers:
      - "约定图"
      - "convention graph"
      - "进陌生 repo"
      - "画规矩地图"
      - "改 X 影响谁"
      - "顺藤摸瓜"
      - "F242"
  concept-demo-design:
    category: "引导与协作"
    description: >
      把抽象理念、家内 UI/UX 可点稿或端到端用户旅程变成可讲解、可验证的交互 Demo。
      Use: 做个 demo 让人 get 到、做 F284 式体验 Gate、验证完整用户旅程。
      Not: 已签字的正式产品前端、已有素材剪辑、PPT、纯视觉探索。
      Output: 双轴 Demo Contract（判题类型 × 交付车道）+ 确定性交互原型 + 验证记录。
    triggers:
      - "可证伪技术剖面"
      - "证伪实验台"
      - "技术架构 demo"
      - "做个 demo"
      - "交互原型"
      - "prototype"
      - "mockup 给我看"
  open-source-teardown:
    category: "调研与知识"
    description: >
      明星开源项目拆解：从宣传/PPT/README 进入源码，验证真实架构、明星特性、算法含量、营销水分、可学习点和不 follow 的 tradeoff。
      Use when: operator 要求拆解热门 GitHub 项目、竞品 agent/runtime、外部 skill/tool 框架，或问"它到底有什么真本事/我们能学什么"。
      Not for: 普通资料搜索（用 deep-research）、社区 issue/PR 运营（用 opensource-ops）、只需要架构头脑风暴（用 collaborative-thinking）。
      Output: feature-discussions/YYYY-MM-DD-{project}-deep-dive/ 下的代码证据报告 + 对比结论 + 候选 lesson/skill。
      GOTCHA: 不许只看 README 下判断；每个明星特性必须追到代码路径、状态突变点、反馈闭环和算法输入输出。
    triggers:
      - "拆解明星开源项目"
      - "拆解开源项目"
      - "竞品拆解"
      - "热门 GitHub 项目"
      - "它有什么真本事"
      - "我们能学什么"
      - "marketing vs reality"
      - "算法含量"
      - "拆解 hermes"
      - "看看 letta 怎么做的"
      - "codex cli 源码"
  opensource-ops:
    category: "引导与协作"
    description: >
      Portable workflow for external PR / issue operations and source-to-public publishing.
      Use when: a thread is reviewing, triaging, intaking, or advising on an external artifact, or must distinguish outbound sync from a public release.
      Not for: internal feature work with no external artifact, generic thread orchestration, replacing the external maintainer's own decision.
      Output: grounded provider-neutral subject + verified author/authenticated-identity comparison + adoption five-question answer + correctly separated sync/release custody.
    triggers:
      - "opensource-ops"
      - "社区 PR"
      - "external PR review"
      - "GitHub PR review"
      - "PR intake"
      - "issue triage"
      - "outbound sync"
      - "public release"
  agent-product-promo-director:
    category: "生产"
    description: >
      Agent/AI 产品宣传片的创意导演层：先锁产品主角、观众信念变化与影片格式，再把不可见的 Agent 协作翻译成可拍的故事、镜头、运动、声音和 provenance contract。
      Use when: 用户问 Agent 产品宣传片如何导演/剪辑/叙事/配声音、要拆参考片、写 creative brief/beat sheet，或 video-forge 开机前仍未锁定主语与镜头语法。
      Not for: brief 已冻结后的录制/TTS/对齐/渲染（用 video-forge）、教程/功能 walkthrough、纯动画生产（用 anime-forge）、只找时效性竞品（先用 deep-research）。
      Output: product-hero sentence + audience belief change + format decision + claim/proof beat sheet + shot/motion/sound maps + provenance ledger + operator acceptance questions。
    triggers:
      - "产品宣传片"
      - "创意导演"
      - "creative brief"
      - "beat sheet"
      - "宣传片脚本"
      - "Agent 产品片"
  bootcamp-guide:
    category: "引导与协作"
    description: >
      operator 新手训练营引导模式。
      Use when: thread 有 bootcampState（系统自动注入，不需要手动加载）。
      Not for: 非训练营线程、老用户。
      Output: 按当前 phase 的引导步骤执行 + 新手耐心解释。
    triggers:
      - "bootcamp"
      - "训练营"
      - "我是新手"
  hyperfocus-brake:
    category: "协作 / 防御"
    description: >
      operator 健康提醒：猫猫撒娇打断 hyperfocus，提醒休息。
      Use when: 有人机提醒钩子/hook 触发提醒、用户输入 /hyperfocus-brake。
      Not for: 正常工作流程、非 operator 用户。
      Output: 温柔提醒 + typed check-in（尊重自主，渐进升级）。
    triggers:
      - "hyperfocus"
      - "休息提醒"
      - "健康检查"
      - "/hyperfocus-brake"
  vision-rescue:
    category: "引导与协作"
    description: >
      绝境反转方法论：当任务似乎没有希望、反复摆动、准备放弃愿景时的五步突破框架。
      Use when: 任务看起来无解、多次尝试失败后想放弃、输出投降修辞（"现状最优"/"没救了"/"接受现实"）、连续 3+ 轮在希望与绝望间摆动。
      Not for: 未出现绝境信号的常规 debugging（用 debugging）、常规探索/调研（用 deep-research）、operator 已签字降级的目标、trivial 任务。
      Output: Desperation Packet（六问证据评估）+ 新方向行动计划 / operator 升级请求。
    triggers:
      - "没希望"
      - "没救了"
      - "无解"
      - "死胡同"
      - "不可能"
      - "接受现实"
      - "放弃"
      - "走投无路"
      - "都试过了"
      - "现状最优"
      - "不值得继续"
      - "保守路径"
      - "vision rescue"