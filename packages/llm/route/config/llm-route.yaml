# ==================== LLM 路由配置（内置） ====================
# TS 重写自 flowforge Python `config/llm_route.yaml`（F28）。
# LLMRoute/RouteResolver/LLMRouter 加载此配置。
# 注意：primary_model 必须与 models.yaml 中 models[].id 完全一致（区分大小写）。

# ==================== 路由定义 ====================
routes:
  # 默认路由：doubao 为主，多模型备选
  default:
    primary_provider: openroute
    primary_model: Doubao-Seed2.0
    fallback_providers:
      - openroute
    fallback_models:
      - DeepSeek-V4-Pro
      - GLM-5.1
      - Kimi-K2.6
    failover_policy:
      conditions:
        - rate_limited
        - timeout
        - moderation_rejected
      timeout_seconds: 200
      max_retries: 2
      retry_delay_seconds: 1.0
    default_temperature: 0.7
    default_max_tokens: 4096

  # 创意路由：高温度，适合写作/创意场景
  creative:
    primary_provider: openroute
    primary_model: GLM-5.1
    fallback_providers:
      - openroute
    fallback_models:
      - Doubao-Seed2.0
      - Qwen3.6-Plus
      - Kimi-K2.6
      - HunYuan3
      - MiniMax-M3
    failover_policy:
      conditions:
        - rate_limited
        - timeout
        - invalid_response
        - echo_response
      timeout_seconds: 150
      max_retries: 0
    default_temperature: 0.9
    default_max_tokens: 8192

  # 精确路由：低温度，适合事实核查/代码生成
  precise:
    primary_provider: openroute
    primary_model: Doubao-Seed2.0
    fallback_providers:
      - openroute
    fallback_models:
      - DeepSeek-V4-Pro
      - GLM-5.1
      - Kimi-K2.6
    failover_policy:
      conditions:
        - rate_limited
        - timeout
        - moderation_rejected
      timeout_seconds: 60
      max_retries: 2
    default_temperature: 0.0
    default_max_tokens: 4096

  # 评委路由：适合 MultiJudge 评委并行评审
  # agent_name 为 multi_judge_<model>，前缀匹配 multi_judge_ → judge 路由
  judge:
    primary_provider: openroute
    primary_model: Doubao-Seed2.0
    fallback_providers:
      - openroute
    fallback_models:
      - Kimi-K2.6
      - GLM-5.1
      - MiniMax-M3
      - HunYuan3
      - Qwen3.6-Plus
      - DeepSeek-V4-Pro
    failover_policy:
      conditions:
        - rate_limited
        - timeout
      timeout_seconds: 300
      max_retries: 0
      retry_delay_seconds: 1.0
    default_temperature: 0.3
    default_max_tokens: 2048

  # 反思路由：reflector 生成改进建议
  reflector:
    primary_provider: openroute
    primary_model: Qwen3.6-Plus
    fallback_providers:
      - openroute
    fallback_models:
      - Doubao-Seed2.0
      - GLM-5.1
      - DeepSeek-V4-Pro
    failover_policy:
      conditions:
        - rate_limited
        - timeout
        - invalid_response
        - echo_response
      timeout_seconds: 60
    default_temperature: 0.7
    default_max_tokens: 4096

# ==================== Agent 路由映射 ====================
# Agent 命名空间 -> 路由名
# 支持前缀匹配: agent_name 以 "multi_judge_" 开头时自动匹配 judge 路由
agent_routes:
  multi_judge_: judge
  reflexion_evaluator: reflector
  reflexion_reflector: reflector
  contentforge:writer: creative
  contentforge:editor: creative
  contentforge:topic: creative
  contentforge:research: creative

# ==================== Agent 模型参数覆盖 ====================
agent_model_params: {}

# ==================== 故障转移条件定义 ====================
failover_conditions:
  rate_limited:
    http_status: 429
    action: fallback
    cooldown_seconds: 60
  timeout:
    threshold_seconds: 90
    action: fallback
  moderation_rejected:
    action: reject  # 不回退，直接拒绝
    notify: true
  error:
    max_consecutive: 3
    action: mark_unhealthy
    recovery_check_seconds: 300
