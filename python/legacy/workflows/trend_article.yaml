name: "trend_article"
version: "1.0"
display_name: "热点追踪"
description: "基于热点趋势的内容创作：趋势分析→选题→写作→发布"
icon: "🔥"
category: "content"

steps:
  - name: "trend_analysis"
    agent: "trend_analysis"
    mode: "react"
    output: "trends"
  - name: "topic_research"
    agent: "topic_research"
    mode: "rewoo"
    output: "topics"
  - name: "writing"
    agent: "article_writing"
    mode: "reflexion"
    output: "draft"
  - name: "publish"
    agent: "publishing"
    mode: "plan_execute"
    output: "published_urls"
