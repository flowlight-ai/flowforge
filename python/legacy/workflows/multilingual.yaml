name: "multilingual"
version: "1.0"
display_name: "多语言发布"
description: "多语言内容创作：选题→素材→写作→翻译→发布"
icon: "🌐"
category: "content"

steps:
  - name: "topic_research"
    agent: "topic_research"
    mode: "rewoo"
    output: "topics"
  - name: "material_collection"
    agent: "material_collection"
    mode: "rewoo"
    output: "materials"
  - name: "writing"
    agent: "article_writing"
    mode: "reflexion"
    output: "draft"
  - name: "translation"
    agent: "multilingual"
    mode: "plan_execute"
    output: "translated"
  - name: "publish"
    agent: "publishing"
    mode: "plan_execute"
    output: "published_urls"
