name: "multi_platform"
version: "1.0"
display_name: "多平台分发"
description: "一次创作多平台分发：选题→写作→内容改写→多渠道发布"
icon: "📡"
category: "content"

steps:
  - name: "topic_research"
    agent: "topic_research"
    mode: "rewoo"
    output: "topics"
  - name: "writing"
    agent: "article_writing"
    mode: "reflexion"
    output: "draft"
  - name: "repurpose"
    agent: "content_repurposer"
    mode: "plan_execute"
    output: "variants"
  - name: "publish"
    agent: "publishing"
    mode: "rewoo"
    output: "published_urls"
