# Trae Agent Provider Manifest
# 按 F241 (CL-014) 声明式 Manifest 配置（铁律 5 配置驱动）
# 详见 [doc:decisions/006-external-agent-integration.md] §4 首批接入
# 详见 [doc:review/review.md#第九章§9.2] EX-002 能力画像

provider_name: "bytedance.trae"
display_name: "Trae"
version: "1.0.0"
protocol: "ide"
transport: "websocket"

capabilities:
  - ide_integration
  - realtime_editing
  - visual_debugging
  - context_aware
  - code_generation

blind_spots:
  - "命令行长任务弱"
  - "无头环境支持差"
  - "CI/CD 集成弱"

timeout_seconds: 180
retry_policy:
  max_attempts: 2
  backoff_seconds: 3

cost_per_token: 0.002
cost_per_call: 0.0

safety_level: "normal"

required_env_vars:
  - TRAE_API_KEY

required_permissions:
  - file_read
  - file_write
  - run_tests
  - lint
