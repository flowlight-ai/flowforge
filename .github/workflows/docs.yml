# OpenRoute Docs - Documentation Lint
# Checks documentation links and markdown formatting
# Simplified version (no mkdocs build)

name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "*.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "*.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check markdown files exist
        run: |
          echo "Checking documentation files..."
          if [ ! -f "README.md" ]; then
            echo "::warning::README.md not found"
          fi
          if [ -d "docs" ]; then
            echo "docs/ directory found"
            find docs/ -name "*.md" | head -20
          else
            echo "::warning::docs/ directory not found"
          fi

      - name: Check for broken internal links
        run: |
          echo "Checking internal markdown links..."
          python -c "
          import os, re, sys
          errors = []
          for root, dirs, files in os.walk('.'):
              if '.git' in root or 'node_modules' in root:
                  continue
              for f in files:
                  if not f.endswith('.md'):
                      continue
                  path = os.path.join(root, f)
                  with open(path, 'r', encoding='utf-8') as fh:
                      for i, line in enumerate(fh, 1):
                          for m in re.finditer(r'\[([^\]]+)\]\(([^)]+\.md[^)]*)\)', line):
                              link = m.group(2).split('#')[0]
                              if link.startswith('http'):
                                  continue
                              target = os.path.normpath(os.path.join(root, link))
                              if not os.path.exists(target):
                                  errors.append(f'{path}:{i}: broken link -> {link}')
          if errors:
              for e in errors:
                  print(f'::warning::{e}')
              print(f'Found {len(errors)} broken link(s)')
          else:
              print('All internal links OK')
          sys.exit(0)
          " || echo "::warning::link check skipped"

      - name: Check markdown formatting with markdownlint
        run: |
          npx --yes markdownlint-cli2 '**/*.md' '#node_modules' '#.github' || echo "::warning::markdownlint not fully configured yet"
