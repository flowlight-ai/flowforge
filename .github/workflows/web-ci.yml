name: Web CI

#T8.1 web/ 分层构建线：仅 web/** 变更触发，与 ts-ci.yml（TS 包矩阵）互不阻塞。
# mixed PR 双线都跑；web-only PR 只跑本线。

on:
  push:
    branches: [main, master, develop]
    paths:
      - "web/**"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "web/**"

permissions:
  contents: read

jobs:
  web:
    name: Web (next lint + next build + e2e smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm (Corepack)
        run: corepack enable && corepack prepare pnpm@11.7.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (next lint)
        run: pnpm --filter @flowforge/web-app lint

      - name: Build (next build)
        run: pnpm --filter @flowforge/web-app build

      # T8.10：端到端冒烟（全路由可达 + 群聊壳层）。next start 由 playwright webServer 拉起，
      # 依赖上一步 build 产物 .next。chromium 浏览器经 --with-deps 安装系统依赖。
      - name: Install Playwright browsers
        run: pnpm --filter @flowforge/web-app exec playwright install --with-deps chromium

      - name: E2E smoke (Playwright)
        run: pnpm --filter @flowforge/web-app test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
