# FlowForge Labels - Auto-label Issues and PRs
# Uses GitHub-provided labeler for path-based labeling
# Also syncs labels defined in this file

name: "Labeler"

on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited, synchronize]
  push:
    branches: [main]
    paths:
      - ".github/labels.yml"
      - ".github/workflows/labels.yml"

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  label-paths:
    name: Label by File Paths
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Label PR by paths
        uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

  label-issues:
    name: Label Issues by Keywords
    runs-on: ubuntu-latest
    if: github.event_name == 'issues'
    steps:
      - name: Label by title/body keywords
        uses: github/issue-labeler@v3
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/issue-labeler.yml
          enable-versioned-regex: 0

  sync-labels:
    name: Sync Labels
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync labels
        uses: crazy-max/ghaction-github-labeler@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          yaml-file: .github/labels.yml
          skip-delete: false
          dry-run: false
