# ==================== LLM 路由配置 ====================
# 定义多模型级联策略和 Agent 路由映射。
# FlowForge LLMRouter + RouteResolver 加载此配置。

# ==================== 路由定义 ====================
# 注意：primary_model 必须与 models.yaml 中 models[].id 完全一致（区分大小写）
# openroute 暴露的模型 ID 为 Pascal-Case: Doubao-Seed2.0 / DeepSeek-V4-Pro / GLM-5.1 等
routes:
  # 默认路由：doubao 为主，多模型备选
  default:
    primary_provider: openroute
    primary_model: Doubao-Seed2.0
    fallback_providers:
      - openroute
    fallback_models:
      - DeepSeek-V4-Pro
      - GLM-5.1
      - Kimi-K2.6
    failover_policy:
      conditions:
        - rate_limited
        - timeout
        - moderation_rejected
      timeout_seconds: 200
      max_retries: 2
      retry_delay_seconds: 1.0
    default_temperature: 0.7
    default_max_tokens: 4096

  # 创意路由：高温度，适合写作/创意场景
  # v4.0: timeout 60→90s — writer prompt 长达 4500+ 字符，Doubao-Seed2.0 实测 63s
  # 60s 太紧导致 timeout→fallback→健康检查雪崩。90s 给长 prompt 足够时间
  # max_retries=0 不重试，直接 fallback（避免单次 90s×2=180s 阻塞）
  # 90s 仍可在 540s total_timeout 内完成 2 轮（90+90+60×2=300s < 540s）
  creative:
    primary_provider: openroute
    primary_model: Doubao-Seed2.0
    fallback_providers:
      - openroute
    fallback_models:
      - DeepSeek-V4-Pro
      - Kimi-K2.6
      - GLM-5.1
      - MiniMax-M3
    failover_policy:
      conditions:
        - rate_limited
        - timeout
        - invalid_response
      timeout_seconds: 90
      max_retries: 0
    default_temperature: 0.9
    default_max_tokens: 8192

  # 精确路由：低温度，适合事实核查/代码生成
  # 修复：DeepSeek-V4-Pro 持续超时(每次93s×3次=280s)阻塞 ReflexionEvaluator 导致迭代超时
  # 改用 Doubao-Seed2.0 作为 primary（更稳定），DeepSeek-V4-Pro 降为 fallback
  # max_retries 从 3 降为 2，避免 evaluator 单次调用 >120s
  precise:
    primary_provider: openroute
    primary_model: Doubao-Seed2.0
    fallback_providers:
      - openroute
    fallback_models:
      - DeepSeek-V4-Pro
      - GLM-5.1
      - Kimi-K2.6
    failover_policy:
      conditions:
        - rate_limited
        - timeout
        - moderation_rejected
      timeout_seconds: 60
      max_retries: 2
    default_temperature: 0.0
    default_max_tokens: 4096

  # 评委路由：适合 MultiJudge 评委并行评审
  # 评委 agent_name 为 multi_judge_<model>，前缀匹配 multi_judge_ → judge 路由
  # v3.7: timeout 120→90s — webchat模型正常30s返回，90s足够；超时快速切换下一个候选
  # max_retries=0（失败立即换下一个模型，不重试）
  # primary=Doubao-Seed2.0（DeepSeek账号被禁言）
  # fallback 链由 models.yaml assignments.judge 提供，FlowForge 统一管理
  judge:
    primary_provider: openroute
    primary_model: Doubao-Seed2.0
    fallback_providers:
      - openroute
    fallback_models:
      - Kimi-K2.6
      - GLM-5.1
      - MiniMax-M3
      - HunYuan3
      - Qwen3.6-Plus
      - DeepSeek-V4-Pro
    failover_policy:
      conditions:
        - rate_limited
        - timeout
      timeout_seconds: 90  # v3.7: 90s足够webchat返回，超时快速切换
      max_retries: 0
      retry_delay_seconds: 1.0
    default_temperature: 0.3
    default_max_tokens: 2048

  # 反思路由：reflector 生成改进建议（原用 default 200s 超时，实际耗时 300s+）
  # v2.1 修复: 限制到 90s + max_retries=1, 总上限 180s（原 300s 导致总超时）
  # reflector 只需生成 3-5 条改进建议，不需要长文生成
  # v3.4 修复: primary 改为 Doubao-Seed2.0（DeepSeek-V4-Pro webchat 返回"无法回答"）
  reflector:
    primary_provider: openroute
    primary_model: Doubao-Seed2.0
    fallback_providers:
      - openroute
    fallback_models:
      - GLM-5.1
      - DeepSeek-V4-Pro
    failover_policy:
      conditions:
        - rate_limited
        - timeout
        - invalid_response
      timeout_seconds: 60

  # StockForge 股票分析路由（P0-21 新增）
  # 原: stockforge agents 走 default 路由 → Doubao-Seed2.0 echo_response 导致失败
  # 新: DeepSeek-V4-Pro 为主（稳定6-10s响应），Doubao-Seed2.0 降为 fallback
  # 超时120s + max_retries=1，总上限240s（单步工具调用+LLM推理）
  stock_analysis:
    primary_provider: openroute
    primary_model: DeepSeek-V4-Pro
    fallback_providers:
      - openroute
    fallback_models:
      - GLM-5.1
      - Doubao-Seed2.0
      - MiniMax-M3
    failover_policy:
      conditions:
        - rate_limited
        - timeout
        - echo_response
      timeout_seconds: 120
      max_retries: 1
      retry_delay_seconds: 1.0
    default_temperature: 0.3
    default_max_tokens: 4096

# ==================== Agent 路由映射 ====================
# Agent 命名空间 -> 路由名
# 支持前缀匹配: agent_name 以 "multi_judge_" 开头时自动匹配 judge 路由
# (LLMClient._get_timeout_for_agent 会先精确匹配,再前缀匹配)
agent_routes:
  # 评委路由(前缀匹配): multi_judge_<model> → judge 路由(240s 超时)
  multi_judge_: judge
  # 反思路由: reflexion_evaluator → reflector 路由(90s 超时, 原 default 200s 导致 300s 耗时)
  reflexion_evaluator: reflector
  # v2.3 修复: reflexion_reflector 也走 reflector 路由(90s)
  # 原: DefaultLLMReflector 硬编码 agent_name="reflexion_reflector" 但 yaml 未映射 → default 200s
  # 日志: agent=reflexion_reflector timeout=200.0s（应走 90s 路由）
  reflexion_reflector: reflector

  # ContentForge Agent
  contentforge:topic: default
  contentforge:research: default
  # v2.4 修复: editor 也走 creative 路由(300s timeout)
  # 原: 未映射 → default 200s → OpenRoute webchat 推理>200s 超时
  contentforge:editor: creative
  contentforge:writer: creative
  contentforge:seo: precise
  contentforge:fact_check: precise
  contentforge:publish: default

  # NovelForge Agent
  novelforge:novel_concept: creative
  novelforge:outline: creative
  novelforge:chapter_writing: creative
  novelforge:chapter_review: default
  novelforge:continuity_check: precise
  novelforge:polisher: creative
  novelforge:full_review: default
  novelforge:publication_advisor: default

  # DevForge Agent
  devforge:requirements_analyst: default
  devforge:architect: creative
  devforge:coder: precise
  devforge:code_reviewer: precise
  devforge:test_generator: precise
  devforge:deployment: default
  devforge:security_auditor: precise

  # MallForge Agent
  mallforge:product_scout: default
  mallforge:listing_generator: creative
  mallforge:ad_optimizer: default
  mallforge:supply_chain: precise
  mallforge:support_agent: default
  mallforge:report_generator: default

  # StockForge Agent
  # P0-21: stockforge agents 原走 default 路由 → Doubao-Seed2.0 echo_response 导致失败
  # 改为走 stock_analysis 路由 → DeepSeek-V4-Pro（更稳定，无 echo 问题）
  stockforge:stock_data: stock_analysis
  stockforge:technical_indicator: stock_analysis
  stockforge:prediction: stock_analysis
  stockforge:risk: stock_analysis
  stockforge:report: stock_analysis
  stockforge:screening: stock_analysis
  stockforge:bull_bear_debate: stock_analysis

# ==================== Agent 模型参数覆盖 ====================
# Agent 命名空间 -> 模型参数覆盖
agent_model_params:
  contentforge:writer:
    temperature: 0.9
    max_tokens: 8192
  contentforge:seo:
    temperature: 0.3
    json_mode: true
  contentforge:fact_check:
    temperature: 0.0
    json_mode: true
  contentforge:publish:
    temperature: 0.3
  novelforge:chapter_writing:
    temperature: 0.9
    max_tokens: 8192
  novelforge:continuity_check:
    temperature: 0.0
    json_mode: true
  devforge:coder:
    temperature: 0.3
    max_tokens: 8192
  devforge:security_auditor:
    temperature: 0.0
  devforge:code_reviewer:
    temperature: 0.3
  mallforge:product_scout:
    temperature: 0.4
    json_mode: true
  mallforge:listing_generator:
    temperature: 0.7
    json_mode: true
  mallforge:ad_optimizer:
    temperature: 0.5
    json_mode: true
  mallforge:supply_chain:
    temperature: 0.3
    json_mode: true
  mallforge:support_agent:
    temperature: 0.6
    json_mode: true
  mallforge:report_generator:
    temperature: 0.4
    json_mode: true

  # StockForge Agent 模型参数（P0-21）
  stockforge:stock_data:
    temperature: 0.0
    max_tokens: 2048
  stockforge:technical_indicator:
    temperature: 0.0
    max_tokens: 2048
  stockforge:prediction:
    temperature: 0.3
    max_tokens: 4096
  stockforge:risk:
    temperature: 0.3
    max_tokens: 4096
  stockforge:report:
    temperature: 0.5
    max_tokens: 8192
  stockforge:screening:
    temperature: 0.3
    max_tokens: 4096

# ==================== 故障转移条件定义 ====================
failover_conditions:
  rate_limited:
    http_status: 429
    action: fallback
    cooldown_seconds: 60
  timeout:
    threshold_seconds: 90
    action: fallback
  moderation_rejected:
    action: reject  # 不回退，直接拒绝
    notify: true
  error:
    max_consecutive: 3
    action: mark_unhealthy
    recovery_check_seconds: 300
