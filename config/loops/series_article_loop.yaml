name: series-article-loop
description: "系列文章创作闭环：系列规划→单章创作（嵌套Loop）→一致性校验→发布"
version: 1.0
max_retries: 2
timeout_per_iteration: 600
total_timeout: 7200
backoff_strategy: "exponential"
backoff_base: 5

planner:
  mode: self_discover
  agent: series-planner
  prompt_template: "plan_series"
  persona_aware: true

worker:
  mode: loop
  template: deep-article-loop

verifier:
  mode: agent_judge
  agent: series-audit
  pass_threshold: 0.8
  rules:
    - "人物设定跨章节一致"
    - "情节无逻辑矛盾"
    - "文风统一"

reflector:
  mode: reflexion
  agent: series-reflector
  max_reflections: 2

memory:
  store_failures: true
  failure_key: "series-failures"
  memory_mapping:
    context: working
    failures: long_term
    rules: semantic
    trajectory: episodic
