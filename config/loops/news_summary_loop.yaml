name: news-summary-loop
description: "新闻快讯创作闭环：热点→素材→撰写→快速审核→发布，时效优先"
version: 1.0
max_retries: 1
timeout_per_iteration: 60
total_timeout: 180
backoff_strategy: "fixed"
backoff_base: 1

planner:
  mode: llm_direct
  agent: news-planner

worker:
  mode: workflow
  workflow: news_summary

verifier:
  mode: rule_based
  pass_threshold: 0.7
  rules:
    - "文章字数 >= 300"
    - "包含至少1个信息源"

reflector:
  mode: reflexion
  agent: news-reflector
  max_reflections: 1

memory:
  store_failures: true
  failure_key: "news-failures"
  memory_mapping:
    context: working
    failures: long_term
