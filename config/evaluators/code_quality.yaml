name: code_quality
description: "代码质量评估器"
dimension: code_quality
evaluator_agent: CodeQualityEvaluatorAgent
scoring_rules:
  - field: readability_score
    weight: 0.2
  - field: maintainability_score
    weight: 0.2
  - field: complexity_score
    weight: 0.2
  - field: duplication_score
    weight: 0.2
  - field: best_practices_score
    weight: 0.2
default_score: 0.0
default_confidence: 0.0
weight: 1.0
threshold: 0.8
