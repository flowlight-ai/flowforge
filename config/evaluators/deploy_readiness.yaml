name: deploy_readiness
description: "部署就绪评估器"
dimension: deploy_readiness
evaluator_agent: DeployReadinessEvaluatorAgent
scoring_rules:
  - field: config_ready
    weight: 0.25
  - field: environment_ready
    weight: 0.25
  - field: rollback_plan
    weight: 0.25
  - field: monitoring_ready
    weight: 0.25
default_score: 0.0
default_confidence: 0.0
weight: 1.0
threshold: 0.8
