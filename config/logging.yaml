version: 1
disable_existing_loggers: false
formatters:
  console:
    format: "[%(levelname)s] %(name)s: %(message)s"
  file:
    format: "%(asctime)s [%(levelname)s] [%(name)s:%(funcName)s:%(lineno)d] [trace_id=%(trace_id)s] %(message)s"
handlers:
  console:
    class: logging.StreamHandler
    formatter: console
    level: INFO
    stream: ext://sys.stdout
  file:
    class: logging.handlers.RotatingFileHandler
    formatter: file
    level: DEBUG
    filename: logs/flowforge.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8
loggers:
  flowforge:
    level: DEBUG
    handlers: [console, file]
    propagate: false
  flowforge.core.metrics:
    level: DEBUG
  flowforge.mcp:
    level: DEBUG
  flowforge.harness:
    level: DEBUG
  flowforge.tools.llm_client:
    level: INFO
root:
  level: INFO
  handlers: [console, file]
