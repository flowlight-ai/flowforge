assignments:
  # v3: 移除所有 free fallback — openroute/free 会路由到 openrouter.ai 的 free 模型，
  # 导致评委/T7审核使用 free 模型（404/429 大量失败，质量分0.0）。
  # 改为只用本地 openroute webchat 模型作为 fallback，确保 100% 本地稳定性。
  # 兜底由 llm_client.py 的 build_cross_fallback_chain 追加 openroute/auto 完成。
  # v3.4 合并: 采用远程多模型 fallback 链（跨厂商排序避免单点故障）+ stockforge/reflexion assignments
  default:
    primary: Doubao-Seed2.0
    fallbacks:
    - DeepSeek-V4-Pro
    - GLM-5.1
    - Kimi-K2.6
    - MiniMax-M3
    - HunYuan3
    - Qwen3.6-Plus
  lightweight:
    primary: Doubao-Seed2.0
    fallbacks:
    - DeepSeek-V4-Pro
    - GLM-5.1
    - Kimi-K2.6
  coding:
    primary: DeepSeek-V4-Pro
    fallbacks:
    - Doubao-Seed2.0
    - GLM-5.1
    - Kimi-K2.6
  # 评委路由：跨厂商排序，避免单厂商故障导致所有评委失败
  # primary=Doubao-Seed2.0（豆包webchat最稳定）
  judge:
    primary: Doubao-Seed2.0
    fallbacks:
    - Kimi-K2.6
    - GLM-5.1
    - Qwen3.6-Plus
    - HunYuan3
    - MiniMax-M3
    - DeepSeek-V4-Pro
  content_create:
    # v4.5: primary 改为 openroute/Doubao-Seed2.0（配合 prefer_api=True 走 siliconflow API, 1.8s）
    # 原 openrouter/nvidia/nemotron-3-super-120b-a12b:free 免费模型不可靠，常返回空内容
    # 不同 assignment 用不同 primary，跨厂商排序避免单点故障
    primary: openroute/Doubao-Seed2.0
    fallbacks:
    - openroute/DeepSeek-V4-Pro
    - openroute/GLM-5.1
    - openroute/Kimi-K2.6
  content_refine:
    # 铁律: polisher 必须使用 Kimi-K2.6
    # 实测 DeepSeek-V4-Pro 润色会降低质量(创作0.85→润色0.57)，Kimi-K2.6 润色保持高质量
    primary: openroute/Kimi-K2.6
    fallbacks:
    - openroute/Doubao-Seed2.0
    - openroute/GLM-5.1
    - openroute/DeepSeek-V4-Pro
  content_eval:
    # v4.5: primary 改为 openroute/GLM-5.1（评估专用，配合 prefer_api=True 走 zhipu API, 1.4s）
    primary: openroute/GLM-5.1
    fallbacks:
    - openroute/Doubao-Seed2.0
    - openroute/DeepSeek-V4-Pro
    - openroute/Kimi-K2.6
  stockforge:stock_data:
    primary: Doubao-Seed2.0
    fallbacks:
    - DeepSeek-V4-Pro
    - GLM-5.1
    - MiniMax-M3
  stockforge:technical_indicator:
    primary: Doubao-Seed2.0
    fallbacks:
    - DeepSeek-V4-Pro
    - GLM-5.1
    - MiniMax-M3
  stockforge:prediction:
    primary: Doubao-Seed2.0
    fallbacks:
    - DeepSeek-V4-Pro
    - GLM-5.1
    - MiniMax-M3
  stockforge:risk:
    primary: Doubao-Seed2.0
    fallbacks:
    - DeepSeek-V4-Pro
    - GLM-5.1
    - MiniMax-M3
  stockforge:report:
    primary: Doubao-Seed2.0
    fallbacks:
    - DeepSeek-V4-Pro
    - GLM-5.1
    - MiniMax-M3
  stockforge:screening:
    primary: Doubao-Seed2.0
    fallbacks:
    - DeepSeek-V4-Pro
    - GLM-5.1
    - MiniMax-M3
  stockforge:bull_bear_debate:
    primary: Doubao-Seed2.0
    fallbacks:
    - DeepSeek-V4-Pro
    - GLM-5.1
    - MiniMax-M3
  # P0-27: reflexion_evaluator/reflexion_reflector 显式 assignments
  # v2: 移除 MiniMax-M3（openroute minimax 平台持续 connection failed），
  # 替换为 Kimi-K2.6（更稳定的 webchat 模型）
  # v3.4 性能修复: API优先 — webchat模型60s超时导致reflector卡死
  reflexion_evaluator:
    # v4.5: primary 改为 openroute/Kimi-K2.6（深度反思，配合 prefer_api=True 走 siliconflow API, 1.8s）
    primary: openroute/Kimi-K2.6
    fallbacks:
    - openroute/Doubao-Seed2.0
    - openroute/DeepSeek-V4-Pro
    - openroute/GLM-5.1
  reflexion_reflector:
    # v4.5: primary 改为 openroute/Qwen3.6-Plus（反思生成，配合 prefer_api=True 走 siliconflow API, 1.8s）
    primary: openroute/Qwen3.6-Plus
    fallbacks:
    - openroute/Doubao-Seed2.0
    - openroute/DeepSeek-V4-Pro
    - openroute/GLM-5.1
