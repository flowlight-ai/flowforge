assignments:
  # v3: 移除所有 free fallback — openroute/free 会路由到 openrouter.ai 的 free 模型，
  # 导致评委/T7审核使用 free 模型（404/429 大量失败，质量分0.0）。
  # 改为只用本地 openroute webchat 模型作为 fallback，确保 100% 本地稳定性。
  # 兜底由 llm_client.py 的 build_cross_fallback_chain 追加 openroute/auto 完成。
  # v3.4 合并: 采用远程多模型 fallback 链（跨厂商排序避免单点故障）+ stockforge/reflexion assignments
  default:
    primary: Doubao-Seed2.0
    fallbacks:
    - DeepSeek-V4-Pro
    - GLM-5.1
    - Kimi-K2.6
    - MiniMax-M3
    - HunYuan3
    - Qwen3.6-Plus
  lightweight:
    primary: Doubao-Seed2.0
    fallbacks:
    - DeepSeek-V4-Pro
    - GLM-5.1
    - Kimi-K2.6
  coding:
    primary: DeepSeek-V4-Pro
    fallbacks:
    - Doubao-Seed2.0
    - GLM-5.1
    - Kimi-K2.6
  # devforge 编码任务：优先使用 Trae AI 助手（文件桥接模式）
  # Trae 不可用时 fallback 到常规编码模型链
  devforge:coding:
    primary: trae
    fallbacks:
    - DeepSeek-V4-Pro
    - Doubao-Seed2.0
    - GLM-5.1
  devforge:code_review:
    primary: trae
    fallbacks:
    - DeepSeek-V4-Pro
    - Doubao-Seed2.0
  devforge:architect:
    primary: trae
    fallbacks:
    - DeepSeek-V4-Pro
    - GLM-5.1
  # 评委路由：跨厂商排序，避免单厂商故障导致所有评委失败
  # primary=Doubao-Seed2.0（豆包webchat最稳定）
  # v5.8: 末尾追加 openrouter 直接API模型作为保底（不经过本地OpenRoute webchat代理）
  # 原因：OpenRoute Playwright在高负载(14次LLM调用)下可能崩溃，导致所有webchat评委失败
  # 约束：webchat模型优先（用户要求5评委评审只用webchat），free模型仅作backup
  judge:
    # v5.13: webchat primary — ark API达到限额(429 Safe Experience Mode)
    # 评委只用3个webchat模型+2个free API保底，降低并发到2避免OpenRoute崩溃
    primary: openroute/GLM-5.1
    fallbacks:
    - openroute/Doubao-Seed2.0
    - openroute/Kimi-K2.6
    - openrouter/nvidia/nemotron-3-super-120b-a12b:free
    - openrouter/openai/gpt-oss-120b:free
  content_create:
    # v5.13: webchat primary — ark API限额，webchat在低并发时可用(Test 7 Writer成功)
    primary: openroute/GLM-5.1
    fallbacks:
    - openroute/DeepSeek-V4-Pro
    - openroute/Doubao-Seed2.0
    - openrouter/nvidia/nemotron-3-super-120b-a12b:free
    - openrouter/openai/gpt-oss-120b:free
  content_refine:
    primary: openroute/GLM-5.1
    fallbacks:
    - openroute/DeepSeek-V4-Pro
    - openrouter/nvidia/nemotron-3-super-120b-a12b:free
    - openrouter/openai/gpt-oss-120b:free
  content_eval:
    primary: openroute/GLM-5.1
    fallbacks:
    - openroute/Doubao-Seed2.0
    - openroute/DeepSeek-V4-Pro
    - openrouter/nvidia/nemotron-3-super-120b-a12b:free
    - openrouter/openai/gpt-oss-120b:free
  stockforge:stock_data:
    primary: Doubao-Seed2.0
    fallbacks:
    - DeepSeek-V4-Pro
    - GLM-5.1
    - MiniMax-M3
  stockforge:technical_indicator:
    primary: Doubao-Seed2.0
    fallbacks:
    - DeepSeek-V4-Pro
    - GLM-5.1
    - MiniMax-M3
  stockforge:prediction:
    primary: Doubao-Seed2.0
    fallbacks:
    - DeepSeek-V4-Pro
    - GLM-5.1
    - MiniMax-M3
  stockforge:risk:
    primary: Doubao-Seed2.0
    fallbacks:
    - DeepSeek-V4-Pro
    - GLM-5.1
    - MiniMax-M3
  stockforge:report:
    primary: Doubao-Seed2.0
    fallbacks:
    - DeepSeek-V4-Pro
    - GLM-5.1
    - MiniMax-M3
  stockforge:screening:
    primary: Doubao-Seed2.0
    fallbacks:
    - DeepSeek-V4-Pro
    - GLM-5.1
    - MiniMax-M3
  stockforge:bull_bear_debate:
    primary: Doubao-Seed2.0
    fallbacks:
    - DeepSeek-V4-Pro
    - GLM-5.1
    - MiniMax-M3
  # P0-27: reflexion_evaluator/reflexion_reflector 显式 assignments
  # v2: 移除 MiniMax-M3（openroute minimax 平台持续 connection failed），
  # 替换为 Kimi-K2.6（更稳定的 webchat 模型）
  # v3.4 性能修复: API优先 — webchat模型60s超时导致reflector卡死
  reflexion_evaluator:
    # v5.13: free API primary — ark API限额(429)
    primary: openrouter/nvidia/nemotron-3-super-120b-a12b:free
    fallbacks:
    - openrouter/openai/gpt-oss-120b:free
    - openroute/Kimi-K2.6
    - openroute/Doubao-Seed2.0
  reflexion_reflector:
    # v5.13: free API primary — ark API限额(429)
    primary: openrouter/nvidia/nemotron-3-super-120b-a12b:free
    fallbacks:
    - openrouter/openai/gpt-oss-120b:free
    - openroute/Qwen3.6-Plus
    - openroute/Doubao-Seed2.0
