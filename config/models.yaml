# ═══════════════════════════════════════════════════════════════════
# Cascade Strategies — LLM级联策略配置
# ═══════════════════════════════════════════════════════════════════
cascade_strategies:
  default:
    primary: doubao-seed2
    fallback:
      - qwen3.6-plus
      - deepseek-chat
    retry_on:
      - rate_limit
      - timeout
      - server_error
    max_retries: 2

  content_writing:
    primary: doubao-seed2
    fallback:
      - qwen3.6-plus
    retry_on:
      - rate_limit
      - timeout

  code_generation:
    primary: deepseek-chat
    fallback:
      - doubao-seed2
    retry_on:
      - rate_limit
      - timeout

  fact_check:
    primary: qwen3.6-plus
    fallback:
      - deepseek-chat
    retry_on:
      - rate_limit
      - timeout

# ═══════════════════════════════════════════════════════════════════
# Provider Quotas — 供应商配额与预算
# ═══════════════════════════════════════════════════════════════════
provider_quotas:
  doubao:
    monthly_budget_usd: 100
    tpm_limit: 100000
    rpm_limit: 500
    alert_threshold: 0.8
  openrouter:
    monthly_budget_usd: 50
    tpm_limit: 50000
    rpm_limit: 200
    alert_threshold: 0.8
