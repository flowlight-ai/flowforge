assignments:
  # v3: 移除所有 free fallback — openroute/free 会路由到 openrouter.ai 的 free 模型，
  # 导致评委/T7审核使用 free 模型（404/429 大量失败，质量分0.0）。
  # 改为只用本地 openroute webchat 模型作为 fallback，确保 100% 本地稳定性。
  # 兜底由 llm_client.py 的 build_cross_fallback_chain 追加 openroute/auto 完成。
  # 说明：*Forge 项目的 assignments 由各自项目通过 Plugin V3 协议在运行时注入，
  # FlowForge 核心仅保留通用能力 assignments（default/lightweight/coding/judge/content_*）。
  default:
    # v5.1临时: API配额全面耗尽(ark 429/kimi 429/aliyuncs 401/siliconflow 403/openrouter 404)
    # 唯一可用API: zhipu/glm-4-flash。待API配额恢复后改回 Doubao-Seed2.0
    primary: zhipu/glm-4-flash
    fallbacks:
    - Doubao-Seed2.0
    - DeepSeek-V4-Pro
    - GLM-5.1
    - Kimi-K2.6
    - MiniMax-M3
    - HunYuan3
    - Qwen3.6-Plus
  lightweight:
    primary: zhipu/glm-4-flash
    fallbacks:
    - Doubao-Seed2.0
    - DeepSeek-V4-Pro
    - GLM-5.1
    - Kimi-K2.6
  coding:
    primary: DeepSeek-V4-Pro
    fallbacks:
    - Doubao-Seed2.0
    - GLM-5.1
    - Kimi-K2.6
  # 评委路由：跨厂商排序，避免单厂商故障导致所有评委失败
  # primary=Doubao-Seed2.0（豆包webchat最稳定）
  # v5.8: 末尾追加 openrouter 直接API模型作为保底（不经过本地OpenRoute webchat代理）
  # 原因：OpenRoute Playwright在高负载(14次LLM调用)下可能崩溃，导致所有webchat评委失败
  # 约束：webchat模型优先（用户要求5评委评审只用webchat），free模型仅作backup
  judge:
    # v5.16: 基于 v515 单评委测试数据调整
    # 移除 Kimi-K2.6（300s 超时不可用），保留 Qwen3.6-Plus（89s 最快）
    # webchat 模型优先（用户要求5评委评审只用webchat）
    primary: Doubao-Seed2.0
    fallbacks:
    - Qwen3.6-Plus
    - HunYuan3
    - GLM-5.1
    - MiniMax-M3
    - DeepSeek-V4-Pro
  content_create:
    # v5.76: primary改为HunYuan3（实测Qwen3.6-Plus返回"无法回答"，Doubao-Seed2.0超时，
    # HunYuan3 webchat稳定生成262字中文，含第一人称+感官细节+口语化）
    # 保留Qwen3.6-Plus/Doubao作为fallback（API模式可能恢复）
    primary: openroute/HunYuan3
    fallbacks:
    - openroute/GLM-5.1
    - openroute/Doubao-Seed2.0
    - openroute/Qwen3.6-Plus
    - openroute/Kimi-K2.6
    - openroute/MiniMax-M3
    - openroute/DeepSeek-V4-Pro
  content_refine:
    # 铁律: polisher 必须使用 Kimi-K2.6
    # 实测 DeepSeek-V4-Pro/Doubao-Seed2.0 润色会降低质量(创作0.85→润色0.57)
    # Kimi-K2.6 超时时 fallback 到 Doubao-Seed2.0
    primary: openroute/Kimi-K2.6
    fallbacks:
    - openroute/Doubao-Seed2.0
    - openroute/Qwen3.6-Plus
    - openroute/HunYuan3
    - openroute/GLM-5.1
    - openroute/DeepSeek-V4-Pro
  content_eval:
    primary: openroute/GLM-5.1
    fallbacks:
    - openroute/Doubao-Seed2.0
    - openroute/DeepSeek-V4-Pro
    - openrouter/nvidia/nemotron-3-super-120b-a12b:free
    - openrouter/openai/gpt-oss-120b:free
  # P0-27: reflexion_evaluator/reflexion_reflector 显式 assignments
  # v2: 移除 MiniMax-M3（openroute minimax 平台持续 connection failed），
  # 替换为 Kimi-K2.6（更稳定的 webchat 模型）
  # v3.4 性能修复: API优先 — webchat模型60s超时导致reflector卡死
  reflexion_evaluator:
    # v5.1临时: API配额耗尽，改用 zhipu/glm-4-flash
    primary: zhipu/glm-4-flash
    fallbacks:
    - openrouter/openai/gpt-oss-120b:free
    - openroute/Kimi-K2.6
    - openroute/Doubao-Seed2.0
  reflexion_reflector:
    # v5.1临时: API配额耗尽，改用 zhipu/glm-4-flash
    primary: zhipu/glm-4-flash
    fallbacks:
    - openrouter/openai/gpt-oss-120b:free
    - openroute/Qwen3.6-Plus
    - openroute/Doubao-Seed2.0
