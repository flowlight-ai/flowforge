active_providers:
- openroute
- openrouter
- doubao
providers:
  openroute:
    base_url: http://127.0.0.1:13001/v1
    api_key_env: OPENROUTE_API_KEY
    # v5.25a: 更新为当前有效的API key（旧key已被403拒绝）
    api_key_default: or-6eb9e20d63d01d190b0e26d06c9f5acc4a0ea248a5dd62e7
    protected: true
    description: 预装默认供应商，用户不可删除或修改
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    user_manageable: true
    description: 自定义模型供应商，用户可管理模型
  aliyuncs:
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: ALIYUN_API_KEY
  ark:
    base_url: https://ark.cn-beijing.volces.com/api/v3
    api_key_env: ARK_API_KEY
  arkcode:
    base_url: https://ark.cn-beijing.volces.com/api/coding/v3
    api_key_env: ARKCODE_API_KEY
  siliconflow:
    base_url: https://api.siliconflow.cn/v1
    api_key_env: SILICONFLOW_API_KEY
  kimi:
    base_url: https://api.moonshot.cn/v1
    api_key_env: KIMI_API_KEY
  zhipu:
    base_url: https://open.bigmodel.cn/api/paas/v4
    api_key_env: ZHIPU_API_KEY
  tencent:
    base_url: https://hunyuan.tencentcloudapi.com/v1
    api_key_env: TENCENT_API_KEY
  local:
    base_url: http://localhost:11434/v1
    api_key_env: LOCAL_API_KEY
  doubao:
    base_url: https://ark.cn-beijing.volces.com/api/v3
    api_key_env: ARK_API_KEY
    description: 豆包大模型官方API（火山引擎Ark平台）
  trae:
    mode: bridge
    bridge_dir: data/trae_bridge
    bridge_timeout: 300
    bridge_poll_interval: 2
    default_model: trae
    session_persistence: true
    description: Trae AI 编码助手（文件桥接模式，让编码 Agent 能调用 Trae 进行编码）
