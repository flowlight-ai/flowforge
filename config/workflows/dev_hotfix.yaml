id: dev_hotfix
name: "Hotfix修复流程"
description: "从Bug分析到修复验证的完整流程"
version: "1.0"

state_schema:
  bug_description: str
  root_cause: str | null
  fix_code: str | null
  test_result: str | null

steps:
  - id: analyze
    name: "Bug分析"
    type: agent
    agent: "devforge:bug_analyzer"
    input_mapping:
      bug_description: "${params.bug_description}"
    output_key: "root_cause"

  - id: fix
    name: "代码修复"
    type: agent
    agent: "devforge:coder"
    input_mapping:
      root_cause: "${state.root_cause}"
    output_key: "fix_code"

  - id: verify
    name: "修复验证"
    type: agent
    agent: "devforge:test_generator"
    input_mapping:
      fix_code: "${state.fix_code}"
    output_key: "test_result"

execution_policy:
  timeout: 600
  retry: 2
  on_error: "retry"

checkpoint:
  enabled: true
  every_n_steps: 1
