name: "generic_plan_execute"
version: "1.0"
display_name: "计划-执行"
description: "先制定计划，再逐步执行，适用于复杂多步骤任务"
icon: "📋"
category: "generic"

steps:
  - id: "plan"
    agent: "planner"
    display_name: "制定计划"
    output: "plan"

  - id: "execute"
    agent: "executor"
    display_name: "逐步执行"
    output: "execution_result"
    substeps: true

  - id: "verify"
    agent: "verifier"
    display_name: "验证结果"
    output: "verification"

  - id: "review"
    agent: "reviewer"
    display_name: "审核确认"
    output: "review_result"
    human_review: true
