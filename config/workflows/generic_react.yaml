name: "generic_react"
version: "1.0"
display_name: "ReAct 通用推理"
description: "通用 ReAct 推理循环，适用于需要多步推理和工具调用的任务"
icon: "🧠"
category: "generic"

steps:
  - id: "think"
    agent: "react_thinker"
    display_name: "思考分析"
    output: "thought"

  - id: "act"
    agent: "react_actor"
    display_name: "执行操作"
    output: "action_result"

  - id: "observe"
    agent: "react_observer"
    display_name: "观察结果"
    output: "observation"
    loop_to: "think"
    max_iterations: 10
