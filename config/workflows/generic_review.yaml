name: "generic_review"
version: "1.0"
display_name: "人工审核"
description: "AI 执行后由人工审核确认，适用于需要人类判断的场景"
icon: "👁️"
category: "generic"

steps:
  - id: "generate"
    agent: "generator"
    display_name: "AI 生成"
    output: "generated"

  - id: "review"
    agent: "reviewer"
    display_name: "人工审核"
    output: "review_result"
    human_review: true

  - id: "approve"
    agent: "approver"
    display_name: "确认发布"
    output: "approval"
