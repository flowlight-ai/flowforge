name: "generic_iterative"
version: "1.0"
display_name: "迭代优化"
description: "生成初稿后迭代优化，直到达到质量标准"
icon: "🔄"
category: "generic"

steps:
  - id: "draft"
    agent: "drafter"
    display_name: "生成初稿"
    output: "draft"

  - id: "critique"
    agent: "critic"
    display_name: "评审反馈"
    output: "critique"

  - id: "refine"
    agent: "refiner"
    display_name: "优化改进"
    output: "refined_draft"
    loop_to: "critique"
    max_iterations: 3
    quality_gate: 0.8

  - id: "finalize"
    agent: "finalizer"
    display_name: "最终定稿"
    output: "final_output"
