  如果查询本身足够简单，则返回原始查询即可。

  原始查询: {query}

  请以JSON数组格式返回分解后的子查询，例如: ["子查询1", "子查询2"]
  只返回JSON数组，不要其他内容。

tools.agentic_rag.expand: |
  你是一个专业的搜索查询扩展专家。请为以下查询生成3个语义相关的扩展查询，
