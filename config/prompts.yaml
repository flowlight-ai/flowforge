  原始查询: {query}

  上下文信息: {context}

  请以JSON数组格式返回扩展查询，例如: ["扩展1", "扩展2", "扩展3"]
  只返回JSON数组，不要其他内容。

tools.agentic_rag.synthesize: |
  你是一个专业的内容综合专家。请根据以下检索到的文档，综合回答用户的问题。

  要求:
  1. 综合所有文档中的相关信息，不要遗漏重要内容
  2. 如果不同文档之间存在矛盾或冲突，请明确指出并说明差异
  3. 在回答末尾标注信息来源
  4. 使用{style}风格撰写

  用户问题: {query}

  检索到的文档:
  {documents}

  请综合以上信息，撰写一个完整、准确的回答。

tools.agentic_rag.conflict_check: |
  请检查以下文档之间是否存在事实性矛盾或冲突信息。

  文档:
  {documents}

  如果存在冲突，请以JSON格式列出:
  [{{"claim": "冲突的观点", "source_a": "文档A的表述", "source_b": "文档B的表述"}}]
  如果没有冲突，返回空数组 []
  只返回JSON数组，不要其他内容。

