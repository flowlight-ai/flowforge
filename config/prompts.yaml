# 占位符: {judge_role} {context_sections} {dimension_lines} {content}
# v6 修复 (2026-07-21): 移除预填充 JSON 模板 — 原 0.50 模板分数被 LLM 原样回显，
# 4 个评委都返回 score=0.50（template echo bug），导致内容质量永远 0.50 无法通过 0.85 阈值。
# 现改为：仅用文本描述 JSON schema，强制 LLM 自行构造 JSON，并在 verifier 端检测全 0.50 的模板回显。
flowforge.verifier.judge_context_template: |
  你是一位{judge_role}。请对以下内容进行多维度独立评审。

  评审上下文:
  {context_sections}

  评审维度（每项 0.0-1.0 浮点数，保留两位小数）:
  {dimension_lines}

  评分规则(0.0-1.0):
  0.95-1.00 卓越 | 0.90-0.94 优秀 | 0.85-0.89 良好 | 0.70-0.84 及格 | 0.00-0.69 不及格

  待评审内容:
  {content}

  【输出要求】
  1. 必须真正阅读并分析上述"待评审内容"，根据内容实际质量给出每项维度的分数。
  2. 禁止返回模板/示例分数（例如所有维度都是 0.50），这会被自动检测并判为无效。
  3. 每个维度的分数必须基于内容在该维度的实际表现，不同维度分数应当有差异（除非内容确实均匀）。
  4. 严格按维度标准评分，不要因为整体还行就给所有维度高分。
  5. 评审要严格客观，宁可低估不要高估。

  【输出格式】
  - 仅输出一个 JSON 对象，不要输出任何其他文字、解释或 Markdown 代码块。
  - JSON 顶层必须包含两个字段:
    * "scores": 对象类型，键为上述每个评审维度名（如 "title_attractiveness"），值为该维度的分数（0.0-1.0 浮点数）。
    * "improvement_suggestions": 数组类型，包含 3-5 条具体的改进建议（每条为非空字符串）。
  - 直接以 {{ 开头，以 }} 结尾，不要用 ```json``` 包裹。

  【评分示例（仅说明格式，禁止照搬此示例分数）】
  假设评审维度为 "quality" 和 "accuracy"，假设内容质量中等，则输出可能形如:
  {{"scores":{{"quality":0.72,"accuracy":0.65}},"improvement_suggestions":["改进建议具体内容1","改进建议具体内容2"]}}

  注意：上述示例仅展示 JSON 结构，禁止直接复制示例中的分数值（0.72, 0.65 等），必须根据实际待评审内容给出真实评分。

# MultiJudgeVerifier 兜底最小提示词（verifier.py 原内联 f-string）
# v6 修复: 同步主模板移除预填充 JSON，仅描述 schema（避免 LLM 原样回显 0.50 模板）
# 占位符: {judge_role} {dimension_lines} {content}
flowforge.verifier.minimal_prompt: |
  你是{judge_role}。

  评审维度:
  {dimension_lines}

  待评审内容:
  {content}

  【输出要求】仅输出一个 JSON 对象，包含 "scores"（每个维度的实际分数 0.0-1.0）和 "improvement_suggestions"（3-5条改进建议）。禁止返回所有维度都是 0.50 的模板分数。直接以{{开头，以}}结尾。
