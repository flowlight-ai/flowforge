# F048 TeamAct Queue Steer 配置
# 对应 docs/features/F048-teamact-queue-steer.md §3.3 配置外置
#
# 铁律 5：所有路径/容量/开关通过本文件注入，禁止硬编码到 .py 文件
# 红线 11：路径为相对路径，运行时由 default.yaml 的 runtime.data_dir 拼接为绝对路径
#
# 不变量映射：
#   I2 → operator_only: true
#   I3 → trace_archive.enabled: true
#   I5 → emergency_can_interrupt_atomic: true

teamact_steer:
  # 总开关
  enabled: true

  # I2 不变量：只有 operator 能提交 SteerCommand
  # submit() 会校验 command.operator_id.startswith("operator")
  operator_only: true

  # 最大待应用指令数（_pending 容量上限）
  # 超过时 submit() 抛 ValueError，防止指令堆积
  max_pending: 100

  # I5 不变量：EMERGENCY 优先级可中断原子操作
  # false 时 EMERGENCY INTERRUPT/CANCEL/REDIRECT 也会被拒绝作用于队首
  emergency_can_interrupt_atomic: true

  # I3 不变量：Steer 影响 trace 记录
  # 每次 apply_to_queue 完成后落盘到 JSONL（append-only）
  trace_archive:
    enabled: true
    # 相对路径，运行时由 runtime.data_dir 拼接
    # 例：data_dir=/var/lib/flowforge → /var/lib/flowforge/data/teamact/steer_trace.jsonl
    path: "data/teamact/steer_trace.jsonl"

  # 优先级数值（用于排序比较，对应 SteerPriority.numeric()）
  # 修改时需同步更新 steer.py 中的 SteerPriority.numeric() 方法
  priority_levels:
    low: 1
    normal: 2
    high: 3
    critical: 4
    emergency: 5

  # Plan Board UI 组件（Phase 2 占位，本 Feature 不实现前端）
  plan_board:
    enabled: false
    websocket_path: "/ws/teamact"
    rest_api_prefix: "/api/teamact/steer"

  # MindCodex 归档集成（Phase 3 占位）
  mindcodex_archive:
    enabled: false
    knowledge_type: "SteerEpisodeCard"
