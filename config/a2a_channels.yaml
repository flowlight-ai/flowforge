# A2A Channel Configuration
#
# Configures the multi-platform channel adapters for the A2A communication
# subsystem. Secrets are referenced via ${ENV_VAR} placeholders and resolved
# from the process environment at runtime (red-line #11: no hardcoded keys).
#
# Only the console channel is enabled by default. Enable platform channels
# by setting `enabled: true` and providing the corresponding environment
# variables.

channels:
  # ── Console (default, dev/debug) ───────────────────────────────
  console:
    enabled: true

  # ── Feishu (Lark) ──────────────────────────────────────────────
  # Routes @mentions from Feishu group chats to A2A agents.
  # Requires the Feishu Open API credentials in the environment.
  feishu:
    enabled: false
    webhook_url: "${FEISHU_WEBHOOK_URL}"
    app_id: "${FEISHU_APP_ID}"
    app_secret: "${FEISHU_APP_SECRET}"

  # ── GitHub PR Review ───────────────────────────────────────────
  # Routes @mentions from GitHub PR review comments to A2A agents.
  # Requires a GitHub API token and webhook secret in the environment.
  github:
    enabled: false
    webhook_secret: "${GITHUB_WEBHOOK_SECRET}"
    api_token: "${GITHUB_API_TOKEN}"
    repos:
      - "your-org/your-repo"
