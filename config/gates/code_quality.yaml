name: "code_quality"
description: "代码质量门：检查代码规范、安全性和测试覆盖率"
type: "automated"
required: true
pass_threshold: 0.8
dimensions:
  - name: "lint_pass"
    weight: 0.3
    threshold: 1.0
    required: true
    description: "代码风格检查：lint 规则全部通过"
  - name: "no_security_issues"
    weight: 0.4
    threshold: 1.0
    required: true
    description: "安全扫描：无已知安全漏洞"
  - name: "test_coverage"
    weight: 0.3
    threshold: 0.8
    required: false
    description: "测试覆盖率：核心模块覆盖率达标"
voting_strategy: "weighted"
veto_dimensions:
  - "no_security_issues"
on_reject:
  action: "retry"
  max_retries: 3
  retry_strategy: "reflexion"
  fallback: "escalate_to_human"
human_required: false
timeout_seconds: 3600
timeout_start_trigger: "gate_start"
auto_pass_on_timeout: false
audit_log_required: true
