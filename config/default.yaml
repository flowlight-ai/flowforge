system:
  db_url: "sqlite:///data/flowforge.db"
  checkpointer_url: "sqlite:///data/checkpoints.db"
  domain_modules: ""
  auto_discover: true
  forge_dirs: ""
  log_level: "INFO"
  log_file: "logs/flowforge.log"
  log_format: "structured"
  server_host: "0.0.0.0"
  server_port: 8000
  workers: 1
  secret_key: "${FLOWFORGE_SECRET_KEY}"

# ==================== Feature Flags ====================
# 新旧路径切换策略：feature_flag(开关) / ab_parallel(A-B验证) / hard_switch(硬切换)
features:
  use_workflow_compiler:
    enabled: true
    rollout_percentage: 100
    fallback_to_old: true
    switch_strategy: "feature_flag"
    description: "Workflow YAML Compiler替代硬编码SOP"
  use_declarative_agent:
    enabled: true
    rollout_percentage: 100
    fallback_to_old: true
    switch_strategy: "feature_flag"
    description: "DeclarativeAgent YAML加载器"
  use_turn_transition_v2:
    enabled: true
    rollout_percentage: 100
    fallback_to_old: true
    switch_strategy: "feature_flag"
    description: "统一状态机TurnTransitionEngine"
  use_llm_router:
    enabled: true
    rollout_percentage: 100
    fallback_to_old: false
    switch_strategy: "ab_parallel"
    description: "LLMRouter多Provider智能路由"
  use_event_store:
    enabled: false
    rollout_percentage: 0
    fallback_to_old: true
    switch_strategy: "ab_parallel"
    description: "EventStore事件持久化"
  use_dual_threshold_compactor:
    enabled: false
    rollout_percentage: 0
    fallback_to_old: true
    switch_strategy: "feature_flag"
    description: "DualThresholdCompactor双阈值压缩"
  use_constraint_engine:
    enabled: false
    rollout_percentage: 0
    fallback_to_old: true
    switch_strategy: "feature_flag"
    description: "ArchitectureConstraintEngine架构约束"
  use_content_moderation:
    enabled: true
    rollout_percentage: 100
    fallback_to_old: true
    switch_strategy: "feature_flag"
    description: "ContentModerationLayer内容安全审核"
  use_permission_v2:
    enabled: false
    rollout_percentage: 0
    fallback_to_old: true
    switch_strategy: "feature_flag"
    description: "PermissionV2增强版权限管线"

logging:
  format: "structured"
  console:
    enabled: true
    level: "INFO"
  file:
    enabled: true
    level: "DEBUG"
    path: "logs/flowforge.log"
    rotation: "10MB"
    retention: 5
  structured:
    # Structured log format for Harness components
    # Uses visual markers for quick console scanning:
    #   ▶ START  — operation begins
    #   ◀ END    — operation completes
    #   ✔ PASS   — gate passed
    #   ⚠ WARN   — gate conditional / entropy signal
    #   ✖ FAIL   — gate failed / error recorded
    #   ⏱ TIMING — performance measurement
    #   🔧 SET    — configuration change
    harness_enabled: true
    feedback_loop:
      show_scores: true
      show_gate_counts: true
      show_timing: true
    entropy_manager:
      show_flags: true
      show_entropy_signals: true

harness:
  enabled: true
  context_engine:
    agents_md_paths: []
  session_manager:
    context_window: 128000
    compact_threshold: 0.92
    tool_output_limit: 25000
    recent_rounds: 3
  feedback_loop:
    evaluation_mode: "lightweight"
    quality_threshold: 0.9
    max_corrections: 1
  entropy_manager:
    doc_gardener_enabled: true
    debt_tracker_enabled: true
    rule_evolution_enabled: true
  credential_store:
    backend: "env"  # env | encrypted_file
    encrypted_file_path: ""  # encrypted_file后端的文件路径

opensieve:
  enabled: true
  endpoint: "http://localhost:8100/api/v1/retrieve"
  timeout: 120

helixrag:
  enabled: true
  endpoint: "http://localhost:8100/api/v1/retrieve"
  timeout: 120
  min_score: 0.3
  max_results: 5

search:
  fallback_chain:
    - opensieve_search
    - tavily_search
    - duckduckgo_search
  llm_web_search:
    enabled: true
    model: "web/chat"

wechat:
  official_enabled: false
  app_id: ""
  app_secret: ""
  token: ""

scheduler:
  enabled: true
  timezone: "Asia/Shanghai"

metrics:
  enabled: true

# ==================== MCP Integration ====================
# MCP (Model Context Protocol) — expose FlowForge tools via MCP Server and
# connect external MCP servers as additional tool providers.
# External server tools are auto-registered with prefix: mcp.{name}.{tool}
mcp:
  server_enabled: true      # Expose FlowForge tools via MCP Server (SSE)
  server_port: 9000
  # External MCP servers to connect as tool providers.
  # Each server's tools are auto-registered with prefix: mcp.{name}.{tool}
  servers: []
  # Example (uncomment and set enabled: true to activate):
  #   - name: "filesystem"
  #     transport: "stdio"
  #     command: "npx"
  #     args: ["-y", "@modelcontextprotocol/server-filesystem", "/path/to/project"]
  #     enabled: false
  #   - name: "github"
  #     transport: "stdio"
  #     command: "npx"
  #     args: ["-y", "@modelcontextprotocol/server-github"]
  #     env:
  #       GITHUB_TOKEN: "${GITHUB_TOKEN}"
  #     enabled: false
