version: "3.9"
services:
  flowforge:
    build: .
    image: flowforge:latest
    container_name: flowforge-api
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY:-changeme}
      - DB_URL=sqlite:///data/flowforge.db
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# API keys are managed via Web UI (Settings page) or stored in data/secrets.db.
# On first startup, you can pass keys as environment variables and they will be
# automatically imported into the secrets store via the resolve() fallback chain:
#   DB → env var → .env file → default
#
# Example: docker run -e OPENROUTER_API_KEY=sk-xxx flowforge:latest
# The key will be available through SecretStore.resolve("OPENROUTER_API_KEY")
# and can then be managed via the Web UI at /admin/settings.
