# FlowForge local deployment composition.
#
#   docker compose up -d        → start in background
#   docker compose logs -f     → follow logs
#   docker compose down        → stop & remove container
#
# An optional .env file next to this compose file provides secrets/runtime config
# (see .env.example). A missing .env is fine — it is loaded only if present.

services:
  flowforge:
    build:
      context: .
      dockerfile: Dockerfile
    image: flowforge-council:0.1.0
    container_name: flowforge-council
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      # Ensure `python flowforge/web/app.py` (Dockerfile CMD) finds the real
      # `flowforge` package at /app/flowforge/ instead of the pip-installed
      # stub in site-packages. Without this, sys.path[0] is the script's
      # directory (/app/flowforge/web/) and Python picks up the stub.
      PYTHONPATH: /app
      # Override .env's localhost:13001 — inside the container, localhost is
      # the container itself, not the host. host.docker.internal resolves to
      # the Docker host's network so the container can reach OpenRoute.
      FLOWFORGE_LLM_ROUTE_OPENROUTE_BASE_URL: "http://host.docker.internal:13001"
    env_file:
      - path: .env
        required: false
    volumes:
      # Persist logs across container rebuilds.
      - ./logs:/app/logs
      # Mount the docs tree so self_dev_doc_loop can read/write design docs.
      - ./docs:/app/docs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/api/agents')"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
